[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 500
fuzz = { runs = 1000 }
# Stateful invariant campaign (test/runner/PetVaultInvariants.t.sol). Kept moderate so the everyday
# suite stays fast; the suite also passes clean at forge's default 256 runs x 500 depth.
invariant = { runs = 128, depth = 128, fail_on_revert = false }
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.ci]
fuzz = { runs = 10000 }

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "verifyContract", url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "verifyContract", url = "https://explorer.testnet.chain.robinhood.com/api/" }
